name: CRM CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: azhan_crm
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      NODE_ENV: test
      DEMO_MODE: true
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/azhan_crm
      TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306/azhan_crm_test_ci
      SESSION_SECRET: ci-session-secret-at-least-16-bytes
      AUTH_ENCRYPTION_KEY: ci-encryption-key-at-least-32-bytes-long
      WA_AUTH_DRIVER: database
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
